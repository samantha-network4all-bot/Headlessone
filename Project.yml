name: Headlessone
options:
  bundleIdPrefix: com.bimboware
  deploymentTarget:
    macOS: "13.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
targets:
  Headlessone:
    type: application
    platform: macOS
    scheme:
      gatherCoverageData: false
    sources:
      - path: Headlessone
    settings:
      base:
        PRODUCT_NAME: Headlessone
        PRODUCT_BUNDLE_IDENTIFIER: com.bimboware.headlessone
        SWIFT_VERSION: "5.9"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: "arm64 x86_64"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        INFOPLIST_FILE: Headlessone/Info.plist
        CODE_SIGN_ENTITLEMENTS: ""
    info:
      path: Headlessone/Info.plist
      properties:
        CFBundleDisplayName: Headlessone
        CFBundleIdentifier: com.bimboware.headlessone
        NSMainNibFile: ""
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: "13.0"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - txt
            CFBundleTypeIconFile: ""
        CFBundleName: Headlessone
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
